# Argus in front of github.com.
#
# Terminates TLS for github.com locally with a certificate from a CA you install into your
# own trust store, then splits every request two ways:
#
#   * paths Argus owns (the dashboard, PR pages, its assets)  -> Argus
#   * everything else (git over HTTPS, issues, actions, the   -> the real github.com
#     settings pages, gh CLI, OAuth flows)
#
# See docs/github-proxy.md for the certificate and hosts-file setup this file assumes.
#
# Install: copy to /etc/nginx/sites-available/argus-github.conf, symlink into
# sites-enabled/, then `nginx -t && systemctl reload nginx`.

# --- Which backend serves a given path ------------------------------------------------
#
# $uri is the decoded, normalised path with the query string removed, which is what the
# route list below wants to match on. Anything not listed here falls through to GitHub, so
# the failure mode of a missing entry is "the real site answers", never a broken page.
map $uri $argus_owns_path {
    default                          0;

    "~^/$"                           1;  # github.com -> Argus dashboard
    "~^/dashboard(/|$)"              1;
    "~^/pulls(/|$)"                  1;
    "~^/notifications(/|$)"          1;  # Argus's notification inbox. Comment out to keep
                                         # GitHub's own notifications page.
    "~^/repos(/|$)"                  1;
    "~^/pr/"                         1;
    "~^/static/"                     1;  # Argus's CSS/JS
    "~^/auth/"                       1;  # Argus's own login/logout, NOT GitHub's /login
    "~^/api/notifications/"          1;

    # github.com/owner/repo/pull/123[/files|/commits|/checks...]
    "~^/[^/]+/[^/]+/pull/[0-9]+(/|$)" 1;
    # github.com/owner/repo/pulls
    "~^/[^/]+/[^/]+/pulls/?$"         1;
}

# ?argus=0 forces a request past Argus to the real site. Argus's own "View on GitHub"
# links carry it; append it by hand any time you want the real page.
map $arg_argus $argus_opt_out {
    default 0;
    "0"     1;
}

# Literal 127.0.0.1 for Argus (no DNS lookup); a hostname for GitHub, so that nginx
# resolves it through the `resolver` below at request time. That matters: a name resolved
# at config-load time would go through /etc/hosts, which now points github.com back at
# this very server. Using a variable in proxy_pass is what forces the runtime lookup.
map "$argus_owns_path$argus_opt_out" $argus_backend {
    default "https://github.com";
    "10"    "http://127.0.0.1:3000";
}

# GitHub does not use websockets on this host today (live updates live on
# alive.github.com), but proxying Connection/Upgrade correctly costs nothing.
map $http_upgrade $argus_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name github.com www.github.com;

    return 301 https://$host$request_uri;
}

server {
    # nginx >= 1.25 prefers `listen 443 ssl;` plus a separate `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name github.com www.github.com;

    ssl_certificate     /etc/nginx/certs/github.com.pem;
    ssl_certificate_key /etc/nginx/certs/github.com-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:argus_github:10m;

    # git pushes are POSTs of unbounded size, and both git and the browser want the
    # response streamed rather than accumulated on disk.
    client_max_body_size    0;
    proxy_request_buffering off;
    proxy_buffering         off;
    proxy_read_timeout      300s;
    proxy_send_timeout      300s;

    # GitHub's response headers do not fit in nginx's default 4k header buffer — its
    # Content-Security-Policy alone is several kilobytes — and every HTML page 502s with
    # "upstream sent too big header" without this. Applies even with buffering off, which
    # only governs the body.
    proxy_buffer_size       32k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;

    access_log /var/log/nginx/argus-github.access.log;
    error_log  /var/log/nginx/argus-github.error.log;

    location / {
        # nginx's own DNS client, deliberately not the system resolver: /etc/hosts has
        # github.com pointing here, and following it would loop.
        resolver          1.1.1.1 8.8.8.8 ipv6=off valid=300s;
        resolver_timeout  5s;

        proxy_pass $argus_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $argus_connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Upstream TLS: verify the real GitHub properly, and send SNI, or it serves the
        # wrong vhost. This is the one connection in the chain that must not be trusted
        # blindly.
        proxy_ssl_server_name       on;
        proxy_ssl_name              github.com;
        proxy_ssl_protocols         TLSv1.2 TLSv1.3;
        proxy_ssl_verify            on;
        proxy_ssl_verify_depth      3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        # If GitHub ever advertises HTTP/3 on this host, passing Alt-Svc through would
        # point browsers at a QUIC port this server does not listen on, costing a timeout
        # per navigation before they fall back. Cheap insurance; today the header is absent.
        proxy_hide_header Alt-Svc;
    }
}
